
name: Python Backend

on: [push, pull_request]

defaults:
  run:
    working-directory: ./backend
jobs:
    test:
      name: Run unit tests
      runs-on: ubuntu-latest
      steps:
        - name: Check out Repo
          uses: actions/checkout@v5
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.14'
        - name: Install linux dependendcies
          run: |
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev
        - name: Install python dependencies
          run: |
            pip install .
            pip install pytest pytest-cov
        - name: Run test suite
          run: |
            pytest tests --doctest-modules --junitxml=test-results.xml --cov-report=xml --cov-report=html
        - name: Upload pytest test results
          uses: actions/upload-artifact@v4
          with:
            name: pytest-results
            path: ./backend/test-results.xml
          if: ${{ always() }}
